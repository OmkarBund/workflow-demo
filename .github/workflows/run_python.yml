name: Return HTTP Response
on:
  workflow_dispatch:
    types: [trigger-http-hook]
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
      ref:
        description: 'Branch or tag to trigger'
        required: false
        default: 'main'
jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - name: Triggered via API
        run: echo "Workflow triggered manually for ${{ github.event.inputs.environment }}"
